# @package _global_.solver
name: Capacitated Vehicle Routing Problem with Deconstruction-Repair
problem: CVRP
algorithm: DR
base_path: ${paths.problems_dir}/cvrp_dr
eval_script: ${.base_path}/eval.py
active: cvrp_dr
